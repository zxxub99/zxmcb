<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2e7d32" />
    <title>钟祥莫愁帮</title>
    <style>
      #loading-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 99999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .loader { width: 48px; height: 48px; border: 4px solid #a5d6a7; border-top-color: #2e7d32;
        border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .load-text { color: #2e7d32; font-size: 16px; font-weight: 500; }
      .error-box { display: none; background: #fff; padding: 24px; border-radius: 12px;
        box-shadow: 0 4px 20px rgba(46,125,50,0.15); text-align: center; max-width: 320px; }
      .error-title { color: #c62828; font-size: 18px; font-weight: 600; margin-bottom: 12px; }
      .error-msg { color: #555; font-size: 14px; line-height: 1.6; word-break: break-all; margin-bottom: 16px; }
      .retry-btn { background: linear-gradient(135deg, #43a047, #2e7d32); color: #fff;
        border: none; padding: 10px 28px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    </style>
    <script type="module" crossorigin src="/assets/index-piya16Cr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BpHkVorU.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- 加载状态 -->
    <div id="loading-screen">
      <div class="loader"></div>
      <div class="load-text">钟祥莫愁帮 加载中...</div>
    </div>

    <!-- 全局错误捕获 -->
    <script>
      window.__APP_ERROR = null;
      window.onerror = function(msg, url, line, col, err) {
        window.__APP_ERROR = { msg: String(msg), url, line, col, stack: err?.stack || '' };
        var el = document.getElementById('loading-screen');
        if (el) {
          el.innerHTML = '<div class="error-box"><div class="error-title">⚠️ 页面加载异常</div>' +
            '<div class="error-msg">' + String(msg) + '<br><small>行 ' + line + ' | ' + url + '</small></div>' +
            '<button class="retry-btn" onclick="location.reload()">🔄 刷新重试</button></div>';
        }
        return true;
      };
      window.onunhandledrejection = function(e) {
        var msg = e.reason ? (e.reason.message || e.reason.name || String(e.reason)) : '未知错误';
        window.__APP_ERROR = { msg };
        if (!document.getElementById('root').childNodes.length) {
          window.onerror(msg, 'Promise', 0, 0);
        }
      };

      // 加载完成后隐藏loading
      function hideLoading() {
        var el = document.getElementById('loading-screen');
        if (el) { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }
      }

      // 超时检测：10秒后如果还在显示loading，提示用户
      setTimeout(function() {
        var el = document.getElementById('loading-screen');
        if (el && !window.__APP_ERROR) {
          el.innerHTML = '<div class="error-box"><div class="error-title">⏱️ 加载超时</div>' +
            '<div class="error-msg">页面加载时间过长，可能是网络问题</div>' +
            '<button class="retry-btn" onclick="location.reload()">🔄 刷新重试</button></div>';
        }
      }, 15000);

      // 监听React挂载成功
      var observer = new MutationObserver(function(mutations) {
        var root = document.getElementById('root');
        if (root && root.childNodes.length > 0) { hideLoading(); observer.disconnect(); }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: false });
    </script>

  </body>
</html>
